[package]
name = "cryptolib"
version = "0.2.0"
edition = "2024"
authors = ["TN3W"]
description = "High-level AES-GCM, Argon2id, PBKDF2, RSA, ML-KEM and ML-DSA with safe defaults"
license = "Apache-2.0"
repository = "https://github.com/tn3w/cryptolib"
keywords = ["cryptography", "encryption", "post-quantum", "password", "signatures"]
categories = ["cryptography"]

[dependencies]
argon2 = "0.5.3"
pqcrypto-mldsa = "0.1.2"
pqcrypto-mlkem = "0.1.1"
pqcrypto-traits = "0.3.5"
rand = "0.8.5"
ring = "0.17.14"
rsa = { version = "0.9.8", features = ["sha2"] }
subtle = "2.6.1"
zeroize = "1.9.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
